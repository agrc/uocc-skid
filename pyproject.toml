[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uocc-skid"
version = "1.0.5"
license = "MIT"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "UGRC", email = "ugrc-developers@utah.gov" }]
keywords = ["gis"]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Topic :: Utilities",
]
dependencies = [
	"ugrc-palletjack>=5.0,<6.1",
	"ugrc-supervisor>=3.1.3",
]

[project.urls]
Homepage = "https://github.com/agrc/skid"
"Issue Tracker" = "https://github.com/agrc/uocc-skid/issues"

[project.optional-dependencies]
dev = [
	"build",
	"hatchling",
	"pytest-cov>=6",
	"pytest-instafail==0.5.*",
	"pytest-mock==3.*",
	"pytest-watch==4.*",
	"pytest>=7,<10",
	"ruff==0.*",
]

[project.scripts]
uocc-skid = "uocc.main:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/uocc"]

[tool.ruff]
line-length = 120
lint.ignore = ["E501"]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src"]
norecursedirs = [".env", "data", "maps", ".github", ".vscode"]
console_output_style = "count"
addopts = "--cov-branch --cov=uocc --cov-report term --cov-report xml:cov.xml --instafail"
